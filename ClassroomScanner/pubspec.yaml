name: classroom_scanner
description: "SmartUni Classroom Scanner — Author/Supervisor: Omar Terro (https://github.com/IOTERRO · https://omarterro.fr). Student (FYP): Khaled Othman."
# Author / Project Supervisor : Omar Terro
# GitHub                      : https://github.com/IOTERRO
# Website                     : https://omarterro.fr
# Student (FYP)               : Khaled Othman
# Date                        : 14 October 2026
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  mobile_scanner: ^6.0.2
  audioplayers: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  image_path: assets/images/classroom_scanner_app_icon.png
  adaptive_icon_background: "#0B3A5C"
  adaptive_icon_foreground: assets/images/classroom_scanner_app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/success.wav
    - assets/sounds/fail.wav
    - assets/images/classroom_scanner_app_icon.png

